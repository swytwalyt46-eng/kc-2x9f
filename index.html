<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}</style></head><body>
<title>حضور ودرجات الطلبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one working surface per tab under a sticky tab bar; the grades table is the main surface, the scanner is a two-column desk on wide screens. */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --surface2:#e9eff3; --head:#e1e9ee;
  --fg:#12202b; --muted:#566774; --line:#d2dbe2;
  --accent:#0e6a86; --accent-ink:#ffffff; --accent-soft:#dbecf2;
  --ok:#17784a; --ok-bg:#dff3e7; --warn:#bf2a1f; --warn-bg:#fde8e6; --amber:#8a5700; --amber-bg:#fcefd0;
  --f-ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e161c; --surface:#16212a; --surface2:#1c2a35; --head:#1d2c37;
    --fg:#e5edf2; --muted:#94a5b1; --line:#2a3a46;
    --accent:#58b9d8; --accent-ink:#06222c; --accent-soft:#17323d;
    --ok:#55d08e; --ok-bg:#12301f; --warn:#ff857a; --warn-bg:#3b1a17; --amber:#f0b955; --amber-bg:#35290f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e161c; --surface:#16212a; --surface2:#1c2a35; --head:#1d2c37;
  --fg:#e5edf2; --muted:#94a5b1; --line:#2a3a46;
  --accent:#58b9d8; --accent-ink:#06222c; --accent-soft:#17323d;
  --ok:#55d08e; --ok-bg:#12301f; --warn:#ff857a; --warn-bg:#3b1a17; --amber:#f0b955; --amber-bg:#35290f;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
.shell{max-width:1280px;margin-inline:auto;padding-inline:16px;padding-block:0 40px}
.brand{display:flex;align-items:center;gap:12px;padding-block:18px 12px}
.brand svg{width:34px;height:34px;color:var(--accent);flex:none}
.brand h1{margin:0;font-size:20px;font-weight:700;line-height:1.2;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;gap:4px;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 1 0;min-height:40px;padding:6px 8px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,.att:focus-visible,.lnk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#banner{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--amber-bg);color:var(--amber);font-weight:500}
main{padding-top:16px}
h2{font-size:16px;margin:0 0 10px;font-weight:700}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span{font-size:12px;color:var(--muted);font-weight:500}
select,input[type=text],input[type=search],input[type=number],input[type=date]{min-height:40px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.btn{min-height:40px;padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--warn)}
.btn[disabled]{opacity:.5;cursor:default}
.lnk{border:0;background:none;color:var(--accent);cursor:pointer;padding:2px 4px;text-decoration:underline;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{padding:3px 10px;border-radius:99px;background:var(--surface2);font-size:13px;font-variant-numeric:tabular-nums}
.chip.warn{background:var(--warn-bg);color:var(--warn);font-weight:600}
.hint{padding:10px 14px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);margin-bottom:12px}

/* scanner */
.desk{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);grid-template-areas:"res" "cap" "rec"}
.desk .res{grid-area:res}.desk .cap{grid-area:cap}.desk .rec{grid-area:rec}
@media (min-width:900px){.desk{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-areas:"cap res" "cap rec";align-items:start;gap:16px}}
@media (max-width:600px){.cam{max-height:230px}}
.tip{margin:8px 0 0;font-size:12px;color:var(--muted)}
.panel{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px;min-width:0}
.cam{position:relative;aspect-ratio:4/3;max-height:320px;width:100%;border-radius:8px;background:#0b1217;overflow:hidden;display:grid;place-items:center;color:#9fb3c0;text-align:center;padding:12px}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;inset:18%;border:2px solid rgba(255,255,255,.75);border-radius:10px;pointer-events:none}
#camMsg{margin:8px 0 0;font-size:13px;color:var(--amber)}
.result{border-radius:10px;padding:18px 16px;min-height:112px;display:flex;flex-direction:column;justify-content:center;gap:4px;background:var(--surface2)}
.result b{font-size:24px;line-height:1.3;text-wrap:balance}
.result span{font-size:14px}
.result .id{font-family:var(--f-mono),var(--f-ui);font-size:13px;opacity:.85}
.result.ok{background:var(--ok-bg);color:var(--ok)}
.result.dup{background:var(--amber-bg);color:var(--amber)}
.result.bad{background:var(--warn-bg);color:var(--warn)}
.result.idle{color:var(--muted)}
.count{margin:14px 0 6px;font-size:15px}
.count b{font-size:22px;font-variant-numeric:tabular-nums}
#recent{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
#recent li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);min-width:0}
#recent li span{min-width:0;overflow-wrap:anywhere}
.sugg{display:flex;flex-direction:column;margin-top:6px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sugg:empty{display:none}
.sugg button{text-align:start;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.sugg button:last-child{border-bottom:0}
.sugg button:hover{background:var(--accent-soft)}
.sugg i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* grades table */
.tablewrap{overflow:auto;max-height:min(72vh,900px);border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.g{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.g th,.g td{padding:4px 6px;border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);text-align:center;white-space:nowrap;background:var(--surface);font-variant-numeric:tabular-nums}
.g thead th{position:sticky;top:0;z-index:3;background:var(--head);font-weight:600}
.g thead tr.r1 th{height:34px}
.g thead tr.r2 th{top:34px;vertical-align:top;padding-block:6px}
.g .sq{position:sticky;inset-inline-start:0;width:44px;min-width:44px;z-index:2;color:var(--muted)}
.g .nm{position:sticky;inset-inline-start:44px;min-width:190px;text-align:start;z-index:2}
.g thead .sq,.g thead .nm{z-index:5}
.g tr.flag td.nm{color:var(--warn);background:var(--warn-bg);font-weight:700}
.g tr.flag .c-abs{color:var(--warn);font-weight:700}
.g .sc{font-weight:600;min-width:64px}
.g .c-tot{background:var(--accent-soft);color:var(--fg);font-weight:700;min-width:72px}
.g .att{cursor:pointer;min-width:58px;user-select:none;color:var(--muted)}
.g .att.p{background:var(--ok-bg);color:var(--ok);font-weight:700}
.g .off{opacity:.45;background-image:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px)}
.g td input{width:64px;min-height:30px;padding:2px 4px;text-align:center;border:1px solid transparent;background:transparent;border-radius:6px}
.g td input:hover{border-color:var(--line)}
.g td input:focus{border-color:var(--accent);background:var(--surface)}
.g td input.bad{border-color:var(--warn);color:var(--warn)}
.hd{display:flex;flex-direction:column;align-items:center;gap:4px}
.hd input{min-height:30px;padding:2px 6px;font-size:12px}
.hd input[type=date]{width:128px}
.hd input.ttl{width:104px;text-align:center}
.hd input.mx{width:52px;text-align:center}
.hd .mini{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.mini button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:1px 8px;cursor:pointer;font-size:12px;min-height:26px}
.mini button.x{color:var(--warn)}
.mini button.onbtn[aria-pressed="true"]{background:var(--ok-bg);color:var(--ok);border-color:transparent}

/* students */
table.l{width:100%;border-collapse:collapse}
.l th,.l td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start}
.l th{background:var(--head);font-weight:600;position:sticky;top:0}
.l .mono{font-family:var(--f-mono);font-size:13px}
.l td.acts{white-space:nowrap;text-align:end}
.sect{margin-bottom:28px;max-width:720px}
.sect p{margin:0 0 10px;color:var(--muted)}
.grid2{display:grid;gap:10px 14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
#status{color:var(--muted);font-size:13px;margin-top:8px;min-height:20px}

/* modal + toast */
#modal{position:fixed;inset:0;z-index:100;background:rgba(8,14,18,.55);display:grid;place-items:center;padding:16px}
.box{background:var(--surface);color:var(--fg);border-radius:12px;padding:18px;width:min(440px,100%);max-height:90%;overflow:auto;border:1px solid var(--line)}
.box h3{margin:0 0 10px;font-size:17px}
.box .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.qrbox{display:grid;place-items:center;gap:8px;text-align:center}
.qrbox canvas{max-width:100%;height:auto;background:#fff;border-radius:6px}
#toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:120;display:flex;justify-content:center;pointer-events:none}
#toast div{background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:500;max-width:100%}
@media (prefers-reduced-motion:no-preference){.result{transition:background-color .15s}}
</style>

<script>
/* Scoring core: pure functions, no DOM. */
var CORE = (function () {
  function num(v) {
    if (v === undefined || v === null || v === "") return null;
    var n = Number(v);
    return isFinite(n) ? n : null;
  }
  function r2(x) { return Math.round(x * 100) / 100; }
  function on(x) { return x.on !== false; }

  function activeDays(cls) { return (cls.days || []).filter(on); }

  // share of each item: score/max clamped to 0..1, averaged, times the component weight
  function share(items, rec, weight) {
    var list = (items || []).filter(on);
    if (!list.length) return 0;
    var sum = 0;
    list.forEach(function (it) {
      var v = num(rec && rec[it.id]);
      var mx = it.max > 0 ? it.max : 1;
      var ratio = (v === null ? 0 : v) / mx;
      sum += Math.min(Math.max(ratio, 0), 1);
    });
    return (sum / list.length) * weight;
  }

  function score(state, cls, sid) {
    var S = state.settings;
    var days = activeDays(cls);
    var a = (state.att && state.att[sid]) || {};
    var present = days.filter(function (d) { return a[d.id]; }).length;
    var att = days.length ? (present / days.length) * S.wAtt : 0;
    var hw = share(cls.hws, state.hw && state.hw[sid], S.wHw);
    var ex = share(cls.exs, state.ex && state.ex[sid], S.wEx);
    var absPct = days.length ? ((days.length - present) / days.length) * 100 : 0;
    return {
      present: present,
      days: days.length,
      att: att,
      hw: hw,
      ex: ex,
      total: att + hw + ex,
      absPct: absPct,
      flagged: days.length > 0 && absPct >= S.absLimit
    };
  }

  function normCode(s) {
    return String(s == null ? "" : s)
      .replace(/[٠-٩]/g, function (c) { return String(c.charCodeAt(0) - 0x0660); })
      .replace(/[۰-۹]/g, function (c) { return String(c.charCodeAt(0) - 0x06F0); })
      .trim();
  }

  function nextId(students, cls) {
    var used = {};
    var max = 0;
    students.forEach(function (s) {
      used[s.id] = 1;
      if (s.cls === cls.id && s.seq > max) max = s.seq;
    });
    var seq = max + 1;
    var id = "2" + cls.no + ("00" + seq).slice(-3);
    while (used[id]) { seq++; id = "2" + cls.no + ("00" + seq).slice(-3); }
    return { id: id, seq: seq };
  }

  return { num: num, r2: r2, activeDays: activeDays, score: score, normCode: normCode, nextId: nextId };
})();
if (typeof module !== "undefined") module.exports = CORE;

</script>

  function qrMatrix(text) {
    var q = qrcode(0, "M"); q.addData(String(text)); q.make();
    var n = q.getModuleCount(), rows = [];

    return rows;
  }
  function drawQR(ctx, text, x, y, size) {
    var m = qrMatrix(text), n = m.length, quiet = 4, mod = Math.floor(size / (n + quiet * 2));
    var total = mod * (n + quiet * 2), ox = x + Math.floor((size - total) / 2), oy = y + Math.floor((size - total) / 2);
    ctx.fillStyle = "#fff"; ctx.fillRect(ox, oy, total, total);
    ctx.fillStyle = "#000";
    for (var r = 0; r < n; r++) for (var k = 0; k < n; k++) if (m[r][k]) ctx.fillRect(ox + (k + quiet) * mod, oy + (r + quiet) * mod, mod, mod);
  }
  async function showQR(s) {
    try { await ensure("qr"); } catch (e) { toast(e.message); return; }
    openModal('<div class="qrbox"><h3>' + esc(s.name) + '</h3><canvas id="qrCv" width="320" height="320"></canvas><div class="mono" style="font-family:var(--f-mono)">' + s.id + '</div><div class="muted">' + esc(label(clsById(s.cls))) + '</div></div><div class="acts"><button class="btn primary" data-r="1">إغلاق</button></div>', function (m) {
      drawQR($("#qrCv").getContext("2d"), s.id, 0, 0, 320);
      m.addEventListener("click", function h(ev) { if (ev.target.closest("[data-r]")) { m.removeEventListener("click", h); closeModal(); } });
    });
  }

  /* ---- PDF cards: each A4 page is drawn on a canvas (browser shapes the Arabic text) and placed as an image ---- */
  function wrapName(ctx, text, maxW) {
    var words = text.split(" "), lines = [], cur = "";
    words.forEach(function (w) {
      var t = cur ? cur + " " + w : w;
      if (ctx.measureText(t).width <= maxW || !cur) cur = t; else { lines.push(cur); cur = w; }
    });
    if (cur) lines.push(cur);
    return lines;
  }
  async function makeCards(list) {
    var st = $("#status");
    if (!list.length) { toast("لا يوجد طلبة لإنشاء بطاقاتهم"); return; }
    try { st.textContent = "جارٍ تحميل المكتبات…"; await Promise.all([ensure("qr"), ensure("pdf")]); }
    catch (e) { st.textContent = e.message; return; }
    try {
      await Promise.all([document.fonts.load('700 28px "IBM Plex Sans Arabic"', "جامعة كركوك"), document.fonts.load('500 20px "IBM Plex Sans Arabic"', "جامعة كركوك")]);
    } catch (e) { /* fallback fonts */ }
    var PX = 8, W = 210 * PX, H = 297 * PX, COLS = 3, ROWS = 5, PER = COLS * ROWS;
    var mx = 6 * PX, my = 6 * PX, cw = (W - 2 * mx) / COLS, ch = (H - 2 * my) / ROWS, ins = 1.5 * PX;
    var cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    var ctx = cv.getContext("2d");
    var pdf = new window.jspdf.jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });
    var pages = Math.ceil(list.length / PER);
    var FONT = '"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif';
    for (var p = 0; p < pages; p++) {
      st.textContent = "جارٍ إنشاء الصفحة " + (p + 1) + " من " + pages + "…";
      await new Promise(function (r) { setTimeout(r, 0); });
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
      ctx.direction = "rtl"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      for (var i = 0; i < PER; i++) {
        var s = list[p * PER + i]; if (!s) break;
        var col = i % COLS, row = Math.floor(i / COLS);
        var x0 = mx + col * cw + ins, y0 = my + row * ch + ins, w = cw - 2 * ins, h = ch - 2 * ins, cx = x0 + w / 2;
        ctx.strokeStyle = "#8a8a8a"; ctx.lineWidth = 2; ctx.setLineDash([10, 8]); ctx.strokeRect(x0, y0, w, h); ctx.setLineDash([]);
        ctx.fillStyle = "#111";
        ctx.font = "500 19px " + FONT; ctx.fillText(S.settings.uni, cx, y0 + 26, w - 24);
        ctx.fillStyle = "#bbb"; ctx.fillRect(x0 + 24, y0 + 46, w - 48, 2);
        var qs = 232; drawQR(ctx, s.id, cx - qs / 2, y0 + 54, qs);
        ctx.fillStyle = "#111"; ctx.font = "600 24px " + FONT; ctx.fillText(s.id, cx, y0 + 54 + qs + 16);
        var size = 28; ctx.font = "700 " + size + "px " + FONT;
        var lines = wrapName(ctx, s.name, w - 28);
        while ((lines.length > 2 || lines.some(function (l) { return ctx.measureText(l).width > w - 28; })) && size > 18) { size -= 2; ctx.font = "700 " + size + "px " + FONT; lines = wrapName(ctx, s.name, w - 28); }
        var ny = y0 + 54 + qs + 52;
        lines.slice(0, 2).forEach(function (l, k) { ctx.fillText(l, cx, ny + k * (size + 6), w - 20); });
        ctx.fillStyle = "#444"; ctx.font = "500 19px " + FONT;
        ctx.fillText(label(clsById(s.cls)), cx, y0 + h - 18, w - 20);
      }
      if (p > 0) pdf.addPage("a4", "portrait");
      pdf.addImage(cv.toDataURL("image/jpeg", 0.9), "JPEG", 0, 0, 210, 297, undefined, "FAST");
    }
    var one = S.ui.sfilter !== "all" && clsById(S.ui.sfilter);
    var name = "بطاقات-QR-" + (one ? label(one) : "كل-الشعب") + ".pdf";
    st.textContent = "";
    await saveBlob(name, pdf.output("blob"));
  }

  /* ---- Excel import ---- */
  function ct(cell) { try { var t = cell.text; if (t != null) return String(t).trim(); } catch (e) { } var v = cell.value; return v == null ? "" : String(v).trim(); }
  async function importXlsx(file) {
    var st = $("#status"); st.textContent = "جارٍ قراءة الملف…";
    try {
      await ensure("xl");
      var wb = new ExcelJS.Workbook(); await wb.xlsx.load(await file.arrayBuffer());
      var newCls = 0, added = 0, skipped = 0, sheets = 0;
      wb.eachSheet(function (ws) {
        var head = [], hr = -1, rows = [];
        ws.eachRow({ includeEmpty: false }, function (row, rn) {
          var a = ct(row.getCell(1)), b = ct(row.getCell(2));
          if (hr < 0) { if (a === "ت" && b.indexOf("الاسم") !== -1) hr = rn; else { row.eachCell(function (cell) { head.push(ct(cell)); }); } }
          else if (/^\d+$/.test(a) && b) rows.push({ seq: parseInt(a, 10), name: b.replace(/\s+/g, " ") });
        });
        if (hr < 0 || !rows.length) return;
        sheets++;
        var info = head.join("\n");
        var g = function (re) { var m = info.match(re); return m ? m[1].trim() : ""; };
        var study = g(/الدراسة:\s*([^|\n]+?)\s*(?:\||\n|$)/), group = g(/الكروب:\s*([^|\n]+?)\s*(?:\||\n|$)/), section = g(/الشعبة:\s*([^|\n]+?)\s*(?:\||\n|$)/);
        if (!study && !group && !section) group = ws.name;
        var c = S.classes.find(function (k) { return k.study === study && k.group === group && k.section === section; });
        if (!c) {
          c = { id: uid("c"), no: Math.max.apply(null, S.classes.map(function (k) { return k.no; }).concat([0])) + 1, study: study, group: group, section: section, days: [], hws: [], exs: [] };
          S.classes.push(c); newCls++;
        }
        var have = {}; S.students.forEach(function (s) { if (s.cls === c.id) have[normAr(s.name)] = 1; });
        rows.forEach(function (r) {
          if (have[normAr(r.name)]) { skipped++; return; }
          var n = CORE.nextId(S.students, c); S.students.push({ id: n.id, cls: c.id, seq: n.seq, name: r.name }); added++;
        });
      });
      if (!sheets) { st.textContent = "لم يُعثر على قوائم طلبة في الملف (يلزم رأس الجدول «ت / الاسم»)."; return; }
      save(); renderStudents();
      $("#status").textContent = "أُضيف " + added + " طالباً" + (newCls ? " في " + newCls + " شعبة جديدة" : "") + (skipped ? "، وتم تخطي " + skipped + " اسماً موجوداً مسبقاً" : "") + ".";
    } catch (e) { st.textContent = "تعذّر استيراد الملف: " + (e.message || e); }
  }

  /* ---- Excel export (header lines follow the department's attendance sheet) ---- */
  async function exportExcel(ids) {
    try { await ensure("xl"); } catch (e) { toast(e.message); return; }
    var W = S.settings, wb = new ExcelJS.Workbook(); wb.creator = W.uni;
    var now = new Date(), stamp = now.getFullYear() + "/" + pad(now.getMonth() + 1) + "/" + pad(now.getDate());
    var thin = { style: "thin", color: { argb: "FF9AA7B0" } }, bd = { top: thin, left: thin, bottom: thin, right: thin };
    var centre = { horizontal: "center", vertical: "middle", wrapText: true };
    var names = {};
    ids.forEach(function (cid) {
      var c = clsById(cid); var list = studentsOf(cid);
      var days = c.days.filter(function (d) { return d.on !== false; }), hws = c.hws.filter(function (d) { return d.on !== false; }), exs = c.exs.filter(function (d) { return d.on !== false; });
      var nm = label(c).replace(/[\\\/\?\*\[\]:]/g, "-").slice(0, 31) || "شعبة"; var k = 2; while (names[nm]) { nm = nm.slice(0, 28) + "-" + k++; } names[nm] = 1;
      var ws = wb.addWorksheet(nm, { views: [{ rightToLeft: true, state: "frozen", xSplit: 2, ySplit: 6 }], pageSetup: { paperSize: 9, orientation: "landscape", fitToPage: true, fitToWidth: 1, fitToHeight: 0, horizontalCentered: true } });
      var N = 2 + days.length + 1 + hws.length + 1 + exs.length + 1 + 2;
      var line = function (r, text, size) { ws.mergeCells(r, 1, r, N); var cell = ws.getCell(r, 1); cell.value = text; cell.font = { name: "Arial", bold: true, size: size }; cell.alignment = centre; ws.getRow(r).height = size + 10; };
      line(1, W.uni, 16); line(2, "قائمة حضور الطلبة - المرحلة " + W.stage, 14);
      line(3, "الدراسة: " + c.study + "    |    الكروب: " + c.group + "    |    الشعبة: " + c.section + "    |    عدد الطلبة: " + list.length, 12);
      line(4, "تاريخ آخر تعديل: " + stamp, 11);
      // header rows 5-6
      var col = 1, hdr = [];
      var put = function (r, cidx, v) { var cell = ws.getCell(r, cidx); cell.value = v; };
      var fixed = function (cidx, text) { ws.mergeCells(5, cidx, 6, cidx); put(5, cidx, text); };
      fixed(1, "ت"); fixed(2, "الاسم"); col = 3;
      var group = function (text, kids) { var n = kids.length + 1; if (n > 1) ws.mergeCells(5, col, 5, col + n - 1); put(5, col, text); kids.forEach(function (t, i) { put(6, col + i, t); }); put(6, col + kids.length, "الدرجة"); col += n; };
      group("الحضور (من " + W.wAtt + ")", days.map(function (d) { return fmtDate(d.date); }));
      group("الواجبات (من " + W.wHw + ")", hws.map(function (x) { return x.title + " (من " + x.max + ")"; }));
      group("الامتحان العملي (من " + W.wEx + ")", exs.map(function (x) { return x.title + " (من " + x.max + ")"; }));
      fixed(col, "المجموع (من " + (W.wAtt + W.wHw + W.wEx) + ")"); fixed(col + 1, "نسبة الغياب");
      for (var r = 5; r <= 6; r++) for (var cc = 1; cc <= N; cc++) { var hc = ws.getCell(r, cc); hc.font = { name: "Arial", bold: true, size: 11 }; hc.alignment = centre; hc.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFDCE6EC" } }; hc.border = bd; }
      ws.getRow(6).height = 34;
      ws.getColumn(1).width = 5; ws.getColumn(2).width = 32;
      for (var q = 3; q <= N; q++) ws.getColumn(q).width = 12;
      list.forEach(function (s, i) {
        var rec = CORE.score(S, c, s.id), a = S.att[s.id] || {}, hw = S.hw[s.id] || {}, ex = S.ex[s.id] || {};
        var vals = [s.seq, s.name];
        days.forEach(function (d) { vals.push(a[d.id] ? "ح" : "غ"); }); vals.push(days.length ? CORE.r2(rec.att) : "");
        hws.forEach(function (x) { var v = CORE.num(hw[x.id]); vals.push(v === null ? "" : v); }); vals.push(hws.length ? CORE.r2(rec.hw) : "");
        exs.forEach(function (x) { var v = CORE.num(ex[x.id]); vals.push(v === null ? "" : v); }); vals.push(exs.length ? CORE.r2(rec.ex) : "");
        vals.push(CORE.r2(rec.total)); vals.push(days.length ? Math.round(rec.absPct) / 100 : "");
        var row = ws.addRow(vals); var rn = row.number;
        for (var z = 1; z <= N; z++) {
          var cell = ws.getCell(rn, z); cell.border = bd; cell.alignment = z === 2 ? { horizontal: "right", vertical: "middle" } : centre; cell.font = { name: "Arial", size: 11 };
          if (typeof cell.value === "number" && z > 2 && z < N) cell.numFmt = "0.00";
        }
        ws.getCell(rn, N).numFmt = "0%";
        for (var dcol = 0; dcol < days.length; dcol++) { var dc = ws.getCell(rn, 3 + dcol); if (dc.value === "غ") dc.font = { name: "Arial", size: 11, color: { argb: "FFBF2A1F" } }; }
        var tc = ws.getCell(rn, N - 1); tc.font = { name: "Arial", size: 11, bold: true }; tc.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFE8F1F5" } };
        if (rec.flagged) {
          [2, N].forEach(function (z2) { var fc = ws.getCell(rn, z2); fc.font = { name: "Arial", size: 11, bold: true, color: { argb: "FFBF2A1F" } }; fc.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFDE8E6" } }; });
        }
      });
      var lr = ws.rowCount + 2; ws.mergeCells(lr, 1, lr, N);
      var lc = ws.getCell(lr, 1); lc.value = "ح = حاضر ، غ = غائب ، الأسماء بالأحمر: نسبة الغياب " + W.absLimit + "% أو أكثر."; lc.font = { name: "Arial", size: 10, italic: true }; lc.alignment = { horizontal: "right" };
    });
    var buf = await wb.xlsx.writeBuffer();
    var one = ids.length === 1 ? label(clsById(ids[0])) : "كل الشعب";
    await saveBlob("درجات-" + one + ".xlsx", new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  }

  /* =====================================================
     SETTINGS
     ===================================================== */
  function renderSettings() {
    var W = S.settings;
    $("#view").innerHTML =
      '<div class="sect"><h2>توزيع الدرجات</h2><p>يُحسب كل قسم نسبياً من عدد الأيام والواجبات والامتحانات المفعّلة فعلاً. المجموع الحالي: <b id="sumW">' + (W.wAtt + W.wHw + W.wEx) + '</b> درجة.</p>' +
      '<div class="grid2"><label class="fld"><span>الحضور</span><input type="number" min="0" step="any" data-set="wAtt" value="' + W.wAtt + '"></label>' +
      '<label class="fld"><span>الواجبات</span><input type="number" min="0" step="any" data-set="wHw" value="' + W.wHw + '"></label>' +
      '<label class="fld"><span>الامتحان العملي</span><input type="number" min="0" step="any" data-set="wEx" value="' + W.wEx + '"></label></div></div>' +
      '<div class="sect"><h2>تنبيه الغياب</h2><p>يظهر اسم الطالب بالأحمر في الجدول والتقرير عند بلوغ هذه النسبة.</p>' +
      '<label class="fld" style="max-width:200px"><span>نسبة الغياب (%)</span><input type="number" min="1" max="100" data-set="absLimit" value="' + W.absLimit + '"></label></div>' +
      '<div class="sect"><h2>الترويسة</h2><div class="grid2" style="grid-template-columns:1fr 1fr"><label class="fld" style="grid-column:1/-1"><span>سطر الجامعة والكلية والقسم</span><input type="text" data-set="uni" value="' + esc(W.uni) + '"></label>' +
      '<label class="fld"><span>المرحلة</span><input type="text" data-set="stage" value="' + esc(W.stage) + '"></label></div></div>' +
      '<div class="sect"><h2>نسخة احتياطية</h2><p>البيانات محفوظة داخل هذا المتصفح فقط. صدّر نسخة بعد كل محاضرة، واستعدها عند تغيير الجهاز.</p>' +
      '<div class="row"><button class="btn primary" data-fact="backup">تصدير نسخة احتياطية</button><label class="btn">استعادة نسخة<input type="file" id="bkIn" accept=".json" hidden></label><button class="btn danger" data-fact="reset">إعادة البيانات الأصلية</button></div></div>';
    $("#bkIn").addEventListener("change", function (e) {
      var f = e.target.files[0]; e.target.value = ""; if (!f) return;
      var rd = new FileReader();
      rd.onload = async function () {
        try {
          var d = JSON.parse(rd.result); if (!d || !d.classes || !d.students) throw new Error("x");
          if (!(await confirmBox("استبدال البيانات الحالية بمحتوى النسخة الاحتياطية؟", "استعادة"))) return;
          S = migrate(d); save(); render(); toast("تمت الاستعادة");
        } catch (err) { toast("الملف ليس نسخة احتياطية صالحة"); }
      };
      rd.readAsText(f);
    });
  }
  $("#view").addEventListener("change", function (e) {
    if (S.ui.tab !== "settings" || !e.target.dataset.set) return;
    var k = e.target.dataset.set, v = e.target.value;
    if (k === "uni" || k === "stage") { S.settings[k] = v.trim() || S.settings[k]; }
    else {
      var n = CORE.num(v); if (n === null || n < 0 || (k === "absLimit" && n < 1)) { e.target.value = S.settings[k]; return; }
      S.settings[k] = n;
    }
    save(); $("#sub").textContent = S.settings.uni + " · المرحلة " + S.settings.stage;
    var s = $("#sumW"); if (s) s.textContent = S.settings.wAtt + S.settings.wHw + S.settings.wEx;
  });
  $("#view").addEventListener("click", async function (e) {
    var b = e.target.closest("[data-fact]"); if (!b || S.ui.tab !== "settings") return;
    if (b.dataset.fact === "backup") {
      var d = new Date();
      await saveBlob("نسخة-احتياطية-" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + ".json", new Blob([JSON.stringify(S)], { type: "application/json" }));
    } else if (b.dataset.fact === "reset") {
      if (await confirmBox("سيُحذف كل الحضور والدرجات وتعود قوائم الطلبة إلى ملف Excel الأصلي. المتابعة؟", "إعادة الضبط")) { S = defaults(); save(); render(); toast("أُعيدت البيانات الأصلية"); }
    }
  });

  render();
})();
